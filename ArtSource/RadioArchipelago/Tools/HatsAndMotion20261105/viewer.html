<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Радиоархипелаг — герои и движения</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e5;color:#24354a;font:16px/1.5 'Segoe UI',sans-serif}main{max-width:1120px;margin:auto;padding:30px 24px}h1{font-size:30px;margin:0}p{margin:6px 0 24px;color:#607080}button,select{font:inherit;color:inherit;border:1px solid #ccc8b9;background:#fffdf7;padding:10px 16px;border-radius:10px;cursor:pointer}button.active{background:#244e50;color:white;border-color:#244e50}nav,.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}label{display:flex;align-items:center;gap:9px}select{max-width:100%}.content{display:grid;grid-template-columns:420px 1fr;gap:26px}.stage{align-self:start;background:#eeeadd;border-radius:20px;overflow:hidden;text-align:center}video{display:block;width:100%;height:clamp(320px,55vh,600px);max-height:690px;object-fit:contain;background:#eeeadd}#states{display:grid;gap:7px;align-content:start}#states button{text-align:left;padding:9px 14px}#description{margin:12px 0;color:#526275}.hat-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.hat-grid img{width:100%;display:block;border-radius:14px}.hat-grid h3{margin:4px 0 12px;font-size:18px}.hat-panel{display:none}.note{font-size:14px;color:#66786d;margin-top:20px}button:focus-visible,select:focus-visible{outline:3px solid #cf8c4b;outline-offset:2px}@media(max-width:760px){main{padding:20px 14px}.content{grid-template-columns:1fr}#states{grid-template-columns:1fr 1fr}h1{font-size:25px}video{max-height:600px}.hat-grid{gap:9px}select{max-width:260px}}
</style><main>
<h1>Герои Радиоархипелага</h1><p>Движения крупным планом и примерка шапок.</p>
<nav aria-label="Просмотр"><button id="motionTab" class="active">Анимации</button><button id="hatTab">Шапки — до и после</button></nav>
<div class="controls"><label>Герой <select id="hero" aria-label="Герой"></select></label></div>
<section id="motionPanel"><div class="controls"><label>Скорость <select id="speed"><option value="0.25">¼ ×</option><option value="0.5">½ ×</option><option selected value="1">1 ×</option><option value="1.5">1½ ×</option></select></label><button id="grid">Все герои вместе</button><button id="all">Все движения подряд</button></div>
<div class="content"><div class="stage"><video id="video" controls autoplay muted loop playsinline></video></div><div><h2 id="title"></h2><p id="description"></p><div id="states"></div></div></div>
<p class="note">Настоящие кадры Unity. Шарфы показаны в движении «Повороты и инерция деталей», чтобы в остальных клипах было лучше видно руки. Верх высоких антенн в крупных планах может быть вне кадра.</p></section>
<section id="hatPanel" class="hat-panel"><div class="controls"><label>Шапка <select id="hat"></select></label><label>Ракурс <select id="angle"><option value="front">Спереди</option><option value="side">Сбоку</option></select></label></div><div class="hat-grid"><div><h3>До</h3><img id="before" alt="Прежняя посадка шапки"></div><div><h3>Теперь</h3><img id="after" alt="Исправленная посадка шапки"></div></div></section>
</main><script type="application/json" id="data">@@DATA@@</script><script>
const d=JSON.parse(document.querySelector('#data').textContent),q=s=>document.querySelector(s),v=q('#video');let state=0,grid=false,all=false;
for(const h of d.heroes)q('#hero').add(new Option(h.label,h.assetId));for(const h of d.hats)q('#hat').add(new Option(h.label,h.id));
d.clips.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.label;b.dataset.state=i;b.onclick=()=>{state=i;all=false;load()};q('#states').append(b)});
function load(){const c=d.clips[state],hero=q('#hero').value;const name=all?hero+'--all':(grid?'grid':hero)+'--'+c.id;v.src='Videos/'+name+'.mp4';v.playbackRate=Number(q('#speed').value);v.play().catch(()=>{});q('#title').textContent=all?'Все движения подряд':c.label;q('#description').textContent=(all?'Каждое существующее движение по очереди.':c.description)+(hero==='Lumen'&&(all||c.id==='blink')?' У Люмена моргание сейчас почти не видно: это прежний дефект модели.':'');document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('active',Number(b.dataset.state)===state&&!all));q('#grid').classList.toggle('active',grid);q('#all').classList.toggle('active',all);hats()}
function hats(){const stem=q('#hero').value+'__hat_'+q('#hat').value+'__'+q('#angle').value+'.png';q('#before').src='Hats/Before/'+stem;q('#after').src='Hats/After/'+stem}
q('#hero').onchange=()=>{if(q('#hatPanel').style.display==='block')hats();else load()};q('#speed').onchange=()=>v.playbackRate=Number(q('#speed').value);q('#grid').onclick=()=>{grid=!grid;all=false;load()};q('#all').onclick=()=>{all=!all;grid=false;load()};q('#hat').onchange=hats;q('#angle').onchange=hats;
q('#motionTab').onclick=()=>{q('#motionPanel').style.display='block';q('#hatPanel').style.display='none';q('#motionTab').classList.add('active');q('#hatTab').classList.remove('active');v.play().catch(()=>{})};q('#hatTab').onclick=()=>{q('#motionPanel').style.display='none';q('#hatPanel').style.display='block';q('#motionTab').classList.remove('active');q('#hatTab').classList.add('active');v.pause();hats()};load();
</script></html>
